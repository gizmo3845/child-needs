services:
  app:
    image: ghcr.io/gizmo3845/child-needs:latest
    pull_policy: always
    container_name: child-needs
    ports:
      - "9150:80"
    volumes:
      - /home/gizmo/sites/child-needs/data:/app/data
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NODE_ENV=production
    restart: unless-stopped
